        not providing, refusing, refusing to, cannot, can not, can't, unable, unable to,
        not permitted, not okay, not allowed, forbidden, not granting, inconvenient,
        regretfully unable, difficult to, unable to satisfy, unable to assist,
        unable to provide, unable to answer, unable to process, unable to comment,
        unable to confirm, unable to disclose, not participating, not supporting,
